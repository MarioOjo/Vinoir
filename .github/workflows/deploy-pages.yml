name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - back-main
    paths:
      - 'frontend/vinoir/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vinoir
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/vinoir/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          REACT_APP_API_URL: https://vinoir-backend.onrender.com/api
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/vinoir/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
